spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        use_sql_comments: true

tosspayments:
  secret-key: ${TOSS_SECRET_KEY:test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6}
  client-key: ${TOSS_CLIENT_KEY:test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm}
  confirm_url: http://localhost:8081/v1/payments/confirm
  base_cancel_url: http://localhost:8081/v1/payments

fcm:
  service-account-file: key/fdbdproject.json
  topic-name: fdbdMessage
  project-id: fdbdproject

aws:
  s3:
    bucket: ${S3_BUCKET}
    accessKey: ${S3_ACCESS_KEY}
    secretKey: ${S3_SECRET_KEY}

logging:
  level:
    org:
      hibernate:
        sql: debug
        type.descriptor.sql.BasicBinder: TRACE
        orm.jdbc.internal.LogicalConnectionImpl: DEBUG
      springframework.orm.jpa: DEBUG
      springframework.transaction: DEBUG
      springframework.web.client.RestTemplate: DEBUG
      com.mudosa.musinsa.common.client: DEBUG

---
spring:
  config:
    activate:
      on-profile: "local & api"

server:
  port: ${API_SERVER_PORT:8080}
  address: 0.0.0.0

management:
  server:
    port: ${API_MANAGEMENT_PORT:8080}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  level:
    root: ${API_LOG_LEVEL_ROOT:info}
    com.mudosa.musinsa.payment: ${API_LOG_LEVEL_PAYMENT:info}

---
spring:
  config:
    activate:
      on-profile: "local & worker"
  main:
    web-application-type: servlet

server:
  port: ${WORKER_SERVER_PORT:18080}
  address: 0.0.0.0

management:
  server:
    port: ${WORKER_MANAGEMENT_PORT:18081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: ${WORKER_LOG_LEVEL_ROOT:info}
    com.mudosa.musinsa.payment.application.service.PaymentQueueWorker: ${WORKER_LOG_LEVEL_QUEUE_WORKER:debug}
    com.mudosa.musinsa.payment.application.service.PaymentQueueRecoveryWorker: ${WORKER_LOG_LEVEL_RECOVERY_WORKER:debug}
