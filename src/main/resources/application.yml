spring:
  profiles:
    active: local
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 50
          min-idle: 10
          max-wait: 3000ms
  
  application:
    name: musinsa-server
  
  jpa:
    properties:
      hibernate:
        format_sql: true

  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false

batch:
  settlement:
    chunk-size: 10
    max-skip-count: 100

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true
    display-request-duration: true
    doc-expansion: none
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  show-actuator: false

jwt:
  secret: ${JWT_SECRET:this-is-a-secret}
  expiration: ${JWT_ACCESS_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}

aws:
  s3:
    bucket: ${S3_BUCKET}
    accessKey: ${S3_ACCESS_KEY}
    secretKey: ${S3_SECRET_KEY}

payment:
  pg-provider: toss

pg:
  rate-limit:
    max-requests: 100        # TossPayments Rate Limit (TPS)
    window-seconds: 1
  queue:
    max-size: 10000           # 대기열 최대 크기 (무한 증가 방지)