spring:
  profiles:
    active: local
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 50
          min-idle: 10
          max-wait: 3000ms
  
  application:
    name: musinsa-server
  
  jpa:
    properties:
      hibernate:
        format_sql: true

  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false

batch:
  settlement:
    chunk-size: 10
    max-skip-count: 100

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true
    display-request-duration: true
    doc-expansion: none
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  show-actuator: false

jwt:
  secret: ${JWT_SECRET:this-is-a-secret}
  expiration: ${JWT_ACCESS_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}

aws:
  s3:
    bucket: ${S3_BUCKET}
    accessKey: ${S3_ACCESS_KEY}
    secretKey: ${S3_SECRET_KEY}

payment:
  pg-provider: toss
  pg-circuit-breaker:
    enabled: ${PAYMENT_PG_CB_ENABLED:true}
    sliding-window-type: ${PAYMENT_PG_CB_SLIDING_WINDOW_TYPE:COUNT_BASED}
    sliding-window-size: ${PAYMENT_PG_CB_SLIDING_WINDOW_SIZE:20}
    minimum-number-of-calls: ${PAYMENT_PG_CB_MINIMUM_NUMBER_OF_CALLS:10}
    failure-rate-threshold: ${PAYMENT_PG_CB_FAILURE_RATE_THRESHOLD:50}
    wait-duration-in-open-state-millis: ${PAYMENT_PG_CB_WAIT_DURATION_IN_OPEN_STATE_MILLIS:10000}
    permitted-number-of-calls-in-half-open-state: ${PAYMENT_PG_CB_PERMITTED_NUMBER_OF_CALLS_IN_HALF_OPEN_STATE:3}
    automatic-transition-from-open-to-half-open-enabled: ${PAYMENT_PG_CB_AUTOMATIC_TRANSITION_TO_HALF_OPEN_ENABLED:true}
  queue:
    worker:
      enabled: true
    kafka:
      topic: ${PAYMENT_QUEUE_KAFKA_TOPIC:payment.confirm.queue}
      group-id: ${PAYMENT_QUEUE_KAFKA_GROUP_ID:payment-queue-consumer}
      consumer-concurrency: ${PAYMENT_QUEUE_KAFKA_CONSUMER_CONCURRENCY:4}
    outbox:
      publisher-delay-millis: ${PAYMENT_QUEUE_OUTBOX_PUBLISHER_DELAY_MILLIS:200}
      batch-size: ${PAYMENT_QUEUE_OUTBOX_BATCH_SIZE:200}
      retry:
        max-retries: ${PAYMENT_QUEUE_OUTBOX_RETRY_MAX_RETRIES:5}
        initial-delay-millis: ${PAYMENT_QUEUE_OUTBOX_RETRY_INITIAL_DELAY_MILLIS:500}
        max-delay-millis: ${PAYMENT_QUEUE_OUTBOX_RETRY_MAX_DELAY_MILLIS:30000}
    recovery:
      reconcile-delay-millis: ${PAYMENT_QUEUE_RECOVERY_RECONCILE_DELAY_MILLIS:5000}
      sweeper-delay-millis: ${PAYMENT_QUEUE_RECOVERY_SWEEPER_DELAY_MILLIS:5000}
      processing-timeout-seconds: ${PAYMENT_QUEUE_RECOVERY_PROCESSING_TIMEOUT_SECONDS:30}
      republish-threshold-seconds: ${PAYMENT_QUEUE_RECOVERY_REPUBLISH_THRESHOLD_SECONDS:60}
      reopen-failed-enabled: ${PAYMENT_QUEUE_RECOVERY_REOPEN_FAILED_ENABLED:false}
    consumer:
      rate-slot-wait-millis: ${PAYMENT_QUEUE_CONSUMER_RATE_SLOT_WAIT_MILLIS:2000}
      rate-slot-retry-delay-millis: ${PAYMENT_QUEUE_CONSUMER_RATE_SLOT_RETRY_DELAY_MILLIS:50}

app:
  file-store:
    provider: ${FILE_STORE_PROVIDER:local}
    mode: ${FILE_STORE_MODE:async}
  datasource:
    routing:
      enabled: ${DB_ROUTING_ENABLED:false}
      read-only-to-replica-enabled: ${DB_READONLY_TO_REPLICA_ENABLED:true}
      replica-health-check-interval-millis: ${DB_REPLICA_HEALTH_CHECK_INTERVAL_MILLIS:5000}
      replica-validation-timeout-seconds: ${DB_REPLICA_VALIDATION_TIMEOUT_SECONDS:2}
    replica:
      enabled: ${DB_REPLICA_ENABLED:false}
      url: ${DB_REPLICA_URL:}
      username: ${DB_REPLICA_USERNAME:}
      password: ${DB_REPLICA_PASSWORD:}
      driver-class-name: ${DB_REPLICA_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
      hikari:
        maximum-pool-size: ${DB_REPLICA_HIKARI_MAX_POOL_SIZE:50}
        minimum-idle: ${DB_REPLICA_HIKARI_MIN_IDLE:10}
        connection-timeout: ${DB_REPLICA_HIKARI_CONNECTION_TIMEOUT:3000}
        max-lifetime: ${DB_REPLICA_HIKARI_MAX_LIFETIME:270000}
        keepalive-time: ${DB_REPLICA_HIKARI_KEEPALIVE_TIME:240000}

fcm:
  enabled: ${FCM_ENABLED:false}

pg:
  rate-limit:
    max-requests: 100        # TossPayments Rate Limit (TPS)
    window-millis: 1000
    redis-key: ${PG_RATE_LIMIT_REDIS_KEY:payment_rate_window:default}

inventory:
  stock-strategy: ${INVENTORY_STOCK_STRATEGY:redis_atomic_outbox}  # redisson_lock | redis_atomic_outbox
  redis:
    host: ${INVENTORY_REDIS_HOST:${spring.data.redis.host}}
    port: ${INVENTORY_REDIS_PORT:${spring.data.redis.port}}
    password: ${INVENTORY_REDIS_PASSWORD:${spring.data.redis.password:}}
    database: ${INVENTORY_REDIS_DATABASE:${spring.data.redis.database}}
  outbox:
    worker:
      enabled: true
    worker-delay-millis: 200
    batch-size: 200
    retry:
      max-retries: 5
      initial-delay-millis: 500
      max-delay-millis: 30000
